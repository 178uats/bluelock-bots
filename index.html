<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock - Panel de Bots</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }
        .bot-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .bot-card h3 {
            margin-top: 0;
            color: #e2e8f0;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-off {
            background-color: #ef4444;
            color: white;
        }
        .btn-on {
            background-color: #22c55e;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Panel de Control - Blue Lock Bots</h1>
    <div id="bot-container" class="grid-container"></div>

    <script>
        const botsData = [
            { id: 'barou', name: 'Shoei Barou' },
            { id: 'niko', name: 'Ikki Niko' },
            { id: 'aryu', name: 'Jyubei Aryu' },
            { id: 'snuffy', name: 'Marc Snuffy' },
            { id: 'lorenzo', name: 'Don Lorenzo' },
            { id: 'aiku', name: 'Oliver Aiku' },
            { id: 'sendo', name: 'Shuto Sendo' },
            { id: 'yukio', name: 'Yukio Ishikari' },
            { id: 'nagi', name: 'Seishiro Nagi' },
            { id: 'reo', name: 'Mikage Reo' },
            { id: 'chris', name: 'Chris Prince' },
            { id: 'charles', name: 'Charles Chevalier' },
            { id: 'shidou', name: 'Ryusei Shidou' },
            { id: 'ego', name: 'Jinpachi Ego' }
        ];

        let state = {};
        botsData.forEach(bot => state[bot.id] = false);

        function renderBots() {
            const container = document.getElementById('bot-container');
            if (!container) return;
            
            container.innerHTML = '';
            botsData.forEach(bot => {
                const card = document.createElement('div');
                card.className = 'bot-card';
                card.innerHTML = `
                    <h3>${bot.name}</h3>
                    <button id="btn-${bot.id}" onclick="toggleBot('${bot.id}')" class="btn-off">
                        ${state[bot.id] ? 'Encendido' : 'Apagado'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function toggleBot(botId) {
            state[botId] = !state[botId];
            
            const btn = document.getElementById(`btn-${botId}`);
            if (btn) {
                btn.innerText = state[botId] ? 'Encendido' : 'Apagado';
                btn.className = state[botId] ? 'btn-on' : 'btn-off';
            }

            fetch('https://bluelock-server-xrff.onrender.com/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state)
            })
            .then(res => res.json())
            .then(data => console.log("Sincronizado:", data))
            .catch(err => console.error("Error con Render:", err));
        }

        window.onload = renderBots;
    </script>
</body>
</html>
